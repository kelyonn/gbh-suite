name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-latest, deliberately — this suite exercises fcntl file locking,
    # networksetup (stubbed via fixtures, but the module still imports
    # subprocess calls shaped around it), ~/.Trash, and psutil.sensors_battery,
    # none of which a Linux runner could honestly exercise.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
